<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ruthless Name Generator</title>

    <style>

      

        body {
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
        }


       

        .gradient {
            background: linear-gradient(to right, #b000ff, blue);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }




        #bg-video {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center 30%;

            z-index: -2;
        }


 

        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.596);

            z-index: -1;
        }


        

        .content {
            position: relative;
            z-index: 1;

            color: white;
            text-align: center;

            padding-top: 200px;
        }




        h1 {
            text-align: center;
        }



        p {
            text-align: center;

            color: rgb(190, 130, 74);

            font-size: 17px;
        }


     
      

        .input-container {
            position: relative;

            width: min(500px, 85%);

            margin: 50px auto 0;
        }


      

        input {
            display: block;

            width: 100%;

            border-radius: 30px;

            padding: 15px 55px 15px 15px;

            border: 0;

            margin: 0;

            background: rgba(255, 255, 255, 0.288);

            color: white;

            outline: none;

            box-sizing: border-box;

            font-size: 16px;
        }



        input::placeholder {
            color: white;

            opacity: 0.6;
        }


        

        .copy-button {
            position: absolute;

            right: 8px;

            top: 50%;

            transform: translateY(-50%);

            width: 40px;
            height: 40px;

            padding: 0;

            margin: 0;

            background: transparent;

            color: white;

            border: none;

            border-radius: 50%;

            font-size: 22px;

            cursor: pointer;

            display: flex;

            justify-content: center;

            align-items: center;
        }


       

        .copy-button:hover {
            background: rgba(255, 255, 255, 0.15);
        }


       
       

        .generate-button {
            display: block;

            margin: 15px auto;

            padding: 12px 25px;

            border: none;

            border-radius: 25px;

            cursor: pointer;

            background-color: rgba(0, 0, 255, 0.801);

            color: white;

            font-size: 16px;
        }


     

        .generate-button:hover {
            background-color: blue;
        }


        /* =========================
           MOBILE RESPONSIVENESS
        ========================= */

        @media (max-width: 600px) {

            .content {
                padding-top: 120px;
            }

            h1 {
                font-size: 28px;

                padding: 0 15px;
            }

            p {
                font-size: 16px;

                padding: 0 15px;
            }

            .input-container {
                width: 85%;
            }

            input {
                padding: 14px 55px 14px 15px;

                font-size: 16px;
            }

            .generate-button {
                padding: 12px 24px;
            }

        }

    </style>

</head>


<body>


  

    <video id="bg-video" autoplay muted loop playsinline>

       <source src="AhaTik_.nur._ff_2228d743-2f8d-4012-ac78-9db901c0fcee_.mp4" type="video/mp4">
    </video>



    <div class="video-overlay"></div>



    <div class="content">

    </div>



    <h1>

        <span class="gradient">
            Name Generator
        </span>

    </h1>


   

    <p>
        Example: Prime
    </p>


  

    <p>
        Result: ＰＲＩＭＥ 情
    </p>



    <div class="input-container">

        <input
            id="nameInput"
            type="text"
            placeholder="Enter your name here"
        >


        <button
            class="copy-button"
            onclick="copyName()"
            aria-label="Copy generated name"
        >

            <span id="copyIcon">⧉</span>

        </button>

    </div>


   

    <button
        class="generate-button"
        onclick="generateName()"
    >

        Generate

    </button>


   

    <script>


     
        function generateName() {

            let input =
                document.getElementById("nameInput");


            let name =
                input.value.toUpperCase();


            let result = "";


            for (
                let i = 0;
                i < name.length;
                i++
            ) {

                let char = name[i];


                if (
                    char >= "A" &&
                    char <= "Z"
                ) {

                    result +=
                        String.fromCharCode(
                            char.charCodeAt(0) + 0xFEE0
                        );

                }

                else {

                    result += char;

                }

            }


           

            result += " 情";


            

            input.value = result;

        }



        

        function copyName() {

            let input =
                document.getElementById("nameInput");


            let copyIcon =
                document.getElementById("copyIcon");


            /* Don't copy if empty */

            if (input.value === "") {

                return;

            }


            /* Copy the generated name */

            navigator.clipboard.writeText(
                input.value
            );


            /* Change icon to tick */

            copyIcon.textContent = "✓";


            /* Change it back after 5 seconds */

            setTimeout(function() {

                copyIcon.textContent = "⧉";

            }, 5000);

        }

    </script>


</body>

</html>
